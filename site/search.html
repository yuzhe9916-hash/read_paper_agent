<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搜索 · CRISPR and repair</title>
  <link rel="stylesheet" href="/read_paper_agent/assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/read_paper_agent/">CRISPR and repair</a>
    <nav>
      <a href="/read_paper_agent/">本周</a>
      <a href="/read_paper_agent/archive.html">归档</a>
      <a href="/read_paper_agent/search.html">搜索</a>
    </nav>
  </header>
  <main>
<div class="search-page" data-search-root data-index-url="/read_paper_agent/data/search.json" data-deep-index-url="/read_paper_agent/data/search-deep.json">
  <h1>搜索</h1>
  <p class="muted">默认检索标题、作者、摘要；勾选「深度搜索」后含 Paper Card 与 Review</p>
  <form class="search-form" role="search">
    <div class="search-input-row">
      <input id="search-query" name="q" type="search" maxlength="200"
             placeholder="CRISPR and repair"
             autocomplete="off" spellcheck="false"/>
      <button type="submit" class="search-submit" id="search-submit">搜索</button>
    </div>
    <label class="search-deep-toggle">
      <input type="checkbox" id="search-deep" />
      深度搜索（含 Paper Card / Review）
    </label>
  </form>
  <p class="search-status" id="search-status" role="status" aria-live="polite">输入关键词开始搜索</p>
  <section id="search-results" aria-label="搜索结果"></section>
  <div class="search-empty" id="search-empty" hidden>
    <p>没有找到匹配项。试试更短的关键词，或减少同时搜索的词。</p>
    <p id="search-deep-hint" hidden>也可以在 Paper Card / Review 中查找：勾选上方「深度搜索」。</p>
  </div>
  <button type="button" class="search-more" id="search-more" hidden>显示更多结果</button>
</div>
<script src="/read_paper_agent/assets/search.js"></script>
</main>
</body>
</html>
